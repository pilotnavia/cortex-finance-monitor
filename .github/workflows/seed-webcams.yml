# Cortex Finance Monitor — webcam data pipeline (Windy Webcams API)
#
# Seeds live webcam camera metadata (geo + meta) into the project's Upstash Redis
# so the Live Webcams panel and the map webcam layer have data to show. The app
# only READS these keys (server/worldmonitor/webcam/v1/list-webcams.ts reads
# webcam:cameras:active + geo/meta); it never seeds. Data keys carry a 24h TTL
# (see scripts/seed-webcams.mjs GEO_TTL), so this must run at least daily.
#
# REQUIRED GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   WINDY_API_KEY             - Windy Webcams API v3 key (PAID). https://api.windy.com/webcams
#   UPSTASH_REDIS_REST_URL    - same value as in Vercel (https://...upstash.io, no quotes)
#   UPSTASH_REDIS_REST_TOKEN  - same value as in Vercel
#
# Until WINDY_API_KEY is set, scripts/seed-webcams.mjs exits early ("skipping")
# and this workflow is a harmless no-op — safe to have enabled beforehand.
#
# COST NOTE: the seed paginates 8 regional bounding boxes (splitting into
# quadrants when a region hits the 10k cap), so a run can make many hundreds of
# Windy calls. Cadence is set to twice daily to stay within TTL while limiting
# call volume; raise/lower the cron below to match your Windy plan.

name: seed-webcams

on:
  workflow_dispatch: {}        # allow manual runs from the Actions tab
  schedule:
    - cron: '0 */12 * * *'     # twice daily (TTL is 24h; 12h leaves a safety margin)

concurrency:
  group: seed-webcams
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Load production env from Vercel so WINDY_API_KEY (and Upstash) come from
      # there — no need to duplicate them into GitHub. Needs one repo secret:
      # VERCEL_TOKEN. Values land in .vercel.env (ephemeral, never printed/committed).
      # No-op without VERCEL_TOKEN (falls back to the workflow env block).
      - name: Pull env from Vercel (if VERCEL_TOKEN set)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uwjwdh8vXisxRPBpArQdN8JD
          VERCEL_PROJECT_ID: prj_T7Pri3bu4NZPJopNlj1TT2aI4jSG
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set — using workflow env only"; exit 0; fi
          # `vercel pull` writes prod vars to .vercel/.env.production.local. Show
          # its output (status/errors only — never the values) so a bad token
          # scope is visible instead of failing silently.
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN" 2>&1 | tail -8 || true
          src=""
          for c in .vercel/.env.production.local .vercel.env .env.production.local .env.local; do
            [ -f "$c" ] && { src="$c"; break; }
          done
          if [ -n "$src" ]; then cp "$src" .vercel.env; echo "Vercel env loaded from $src: $(grep -cE '^[A-Za-z_]' .vercel.env) vars"; else echo "NO env file produced (check the token is scoped to the denavi team)"; fi

      # scripts/seed-webcams.mjs uses only global fetch + Node built-ins, so no
      # npm install is needed (matches seed-finance.yml — avoids lockfile drift).
      - name: Seed webcams (Windy -> Redis geo+meta)
        run: |
          # Take WINDY_API_KEY *and UPSTASH* from Vercel when available, so the seed writes
          # to the SAME Redis the runtime reads (Adrian 2026-09-24: el seed escribia en el
          # Upstash del secret de GitHub y el app leia el de Vercel -> panel vacio con 1050
          # camaras "sembradas"). Fallback a los secrets de GitHub si no hay .vercel.env.
          take() { line="$(grep -m1 -E "^$1=" .vercel.env)" && { v="${line#*=}"; v="${v%\"}"; v="${v#\"}"; [ -n "$v" ] && [ "$v" != "[SENSITIVE]" ] && export "$1=$v"; }; }
          if [ -f .vercel.env ]; then
            take WINDY_API_KEY
            take UPSTASH_REDIS_REST_URL
            take UPSTASH_REDIS_REST_TOKEN
          fi
          # Non-secret fingerprint: confirm which Upstash the seed will write to vs the GitHub secret.
          gh_fp=$(printf '%s' "${{ secrets.UPSTASH_REDIS_REST_URL }}" | sha256sum | cut -c1-12)
          use_fp=$(printf '%s' "$UPSTASH_REDIS_REST_URL" | sha256sum | cut -c1-12)
          echo "[upstash] github-secret sha=$gh_fp  seed-will-use sha=$use_fp  match=$([ "$gh_fp" = "$use_fp" ] && echo yes || echo NO)"
          node scripts/seed-webcams.mjs
